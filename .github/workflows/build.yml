name: Build release packages

# Builds the standalone telemetry-overlay-gui executable for Windows, macOS
# and Linux with PyInstaller (see packaging/telemetry-overlay.spec) and
# attaches one archive per OS to the GitHub Release. Runs on every tag that
# looks like a version (v1.0.0) and can also be triggered manually to test
# the build without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: telemetry-overlay-gui-windows
          - os: macos-latest
            artifact_name: telemetry-overlay-gui-macos
          - os: ubuntu-latest
            artifact_name: telemetry-overlay-gui-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The tag is the only version number a user ever sees on GitHub, and
      # telemetry_overlay.__version__ is the only one they see in the GUI. Nothing
      # derives one from the other, so check them here and refuse to build a
      # release whose executable would report a different version than its tag.
      - name: Check the tag matches telemetry_overlay.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/telemetry_overlay/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag  __version__=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match __version__ '$version'. Bump src/telemetry_overlay/__init__.py and re-tag."
            exit 1
          fi

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Build executable
        run: pyinstaller packaging/telemetry-overlay.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a -tzip ../${{ matrix.artifact_name }}.zip telemetry-overlay-gui
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg_staging
          cp -R "dist/TelemetryOverlay.app" dmg_staging/
          cp -R sample_data dmg_staging/
          hdiutil create -volname "Telemetry Overlay" -srcfolder "dmg_staging" -ov -format UDZO "${{ matrix.artifact_name }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf ../${{ matrix.artifact_name }}.tar.gz telemetry-overlay-gui

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.dmg
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.dmg
            ${{ matrix.artifact_name }}.tar.gz
