[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-overlay"
# Single source of truth: telemetry_overlay.__version__ (see [tool.setuptools.dynamic]
# below). The release tag is checked against it by .github/workflows/build.yml.
dynamic = ["version"]
description = "Burn ArduPilot telemetry onto flight video as an FPV-style HUD/OSD overlay"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4.42",
    "PySide6>=6.6",
    "numpy>=1.26",
    "av>=12.0",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# pillow: used by scripts/generate_icon.py and scripts/generate_splash.py, and by
# the release workflow to read the version baked into the splash PNG.
dev = ["pytest>=8.0", "pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
telemetry-overlay = "telemetry_overlay.cli:main"
telemetry-overlay-gui = "telemetry_overlay.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "telemetry_overlay.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"telemetry_overlay.gui" = ["assets/*.png", "assets/*.ico", "assets/*.icns"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
