[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-overlay"
version = "0.1.0"
description = "Burn ArduPilot telemetry onto flight video as an FPV-style HUD/OSD overlay"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4.42",
    "PySide6>=6.6",
    "numpy>=1.26",
    "av>=12.0",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
telemetry-overlay = "telemetry_overlay.cli:main"
telemetry-overlay-gui = "telemetry_overlay.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
